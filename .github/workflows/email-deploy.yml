name: email-deploy

# Provisions the Mailgun domain + GoDaddy DNS + inbound routes from terraform/.
# Requires the S3 state bucket to exist (created once, manually — see README).
#
# Triggers:
#   - push to main (touching terraform/) -> applies automatically
#   - manual dispatch                     -> plan or apply, your choice
on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/email-deploy.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: email-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

  # push to main => apply automatically; manual run => the chosen input.
  TF_ACTION: ${{ github.event_name == 'push' && 'apply' || inputs.action }}

  # --- Provider credentials (GitHub secrets) ---
  TF_VAR_mailgun_api_key: ${{ secrets.MAILGUN_API_KEY }}
  GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
  GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}

  # --- AWS creds for the S3 state backend ---
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  email-deploy:
    name: email-deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # >= 1.10 for native S3 state locking (use_lockfile) — no DynamoDB.
          terraform_version: "1.11.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lokvritfoundation/email/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: env.TF_ACTION == 'plan'
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: env.TF_ACTION == 'apply'
        run: terraform apply -input=false -no-color -auto-approve

      # Ask Mailgun to re-check DNS and mark the domain verified. Best-effort:
      # DNS can take minutes/hours to propagate, so this never fails the run —
      # re-run email-deploy (action=apply) later if it isn't green yet.
      - name: Verify Mailgun domain
        if: env.TF_ACTION == 'apply'
        continue-on-error: true
        run: |
          API_HOST="api.mailgun.net"
          if [ "${{ vars.MAILGUN_REGION }}" = "eu" ]; then API_HOST="api.eu.mailgun.net"; fi
          DOMAIN="$(terraform output -raw mailgun_domain)"
          echo "Triggering verification for $DOMAIN via $API_HOST"
          curl -s --user "api:${TF_VAR_mailgun_api_key}" \
            -X PUT "https://${API_HOST}/v4/domains/${DOMAIN}/verify" | tee verify.json
          echo
          echo "State: $(grep -o '\"state\":[^,}]*' verify.json || true)"
